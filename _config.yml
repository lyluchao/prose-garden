# Hexo Configuration
title: 散文花园
subtitle: '文字的心灵栖息地'
description: '散文创作与分享的独立空间'
keywords: 散文,随笔,文学,创作,美文
author: lyluchao
language: zh-CN
timezone: 'Asia/Shanghai'

# URL设置（GitHub Pages）
url: https://lyluchao.github.io/prose-garden
root: /prose-garden/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# 目录结构
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# 写作设置
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
exclude:
  - '*.log'
  - '*.tmp'
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true

# 代码高亮
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: '    '
  wrap: true
  hljs: false

# 首页设置
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# 分类与标签
default_category: uncategorized
category_map:
  抒情散文: lyrical
  叙事散文: narrative
  哲理散文: philosophical
  游记散文: travel
tag_map:

# 日期格式
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# 分页
per_page: 12
pagination_dir: page

# 主题
theme: next

# 部署到您的GitHub仓库
deploy:
  type: git
  repo: https://github.com/lyluchao/prose-garden.git
  branch: gh-pages
  message: '更新散文花园: {{ now("YYYY-MM-DD HH:mm:ss") }}'
